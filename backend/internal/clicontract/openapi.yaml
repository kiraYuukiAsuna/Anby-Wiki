            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: anby_session
      description: HttpOnly 同源服务端 session cookie；名称可由部署配置覆盖
    cliBearer:
      type: http
      scheme: bearer
      bearerFormat: AnbyWikiCLI
      description: 由一次性 CLI 授权码兑换、可在账号后台撤销的长期 Token
  headers:
    X-Request-ID:
      description: 请求 ID；客户端可携带同名请求头，服务端透传或重新生成
      schema:
        type: string
  parameters:
    PageId:
      name: id
      in: path
      required: true
      description: 页面 ID（UUIDv7）
      schema:
        type: string
        format: uuid
    ReferenceTargetId:
      name: id
      in: path
      required: true
      description: Entity、Claim 或 Citation 稳定 ID
      schema:
        type: string
        format: uuid
    GovernanceId:
      name: id
      in: path
      required: true
      description: Proposal、ReviewTask 或 ChangeBatch ID
      schema:
        type: string
        format: uuid
    RevisionId:
      name: rid
      in: path
      required: true
      description: Revision ID（UUIDv7）
      schema:
        type: string
        format: uuid
    ContentMode:
      name: content_mode
      in: query
      required: false
      description: >-
        auto 对大于 64 KiB 且分片投影就绪的页面返回 sections；full 强制全文；
        sections 在投影就绪时强制分片，否则安全降级为 full。
      schema:
        type: string
        enum: [auto, full, sections]
        default: auto
    AssetRevisionId:
      name: revision_id
      in: path
      required: true
      description: 不可变 AssetRevision ID
      schema:
        type: string
        format: uuid
    ComponentVersion:
      name: version
      in: path
      required: true
      description: 正整数组件版本
      schema:
        type: integer
        minimum: 1
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        变更类请求的幂等键（客户端生成的 UUID）。
        服务端对相同 Actor + 幂等键的重复请求返回首次处理结果，不重复执行。
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 上一页响应返回的 next_cursor；首页不传
      schema:
        type: string
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数，默认 20，最大 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{2,31}$"
          description: 不区分大小写；服务端规范化为小写。
        email:
          type: string
          format: email
          maxLength: 254
          description: 不区分大小写。
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          maxLength: 128
          description: 省略时使用规范化用户名。
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: 用户名或邮箱，不区分大小写。
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    AuthResult:
      type: object
      required: [actor_id, display_name]
      properties:
        actor_id:
          type: string
          format: uuid
        display_name:
          type: string
    AuthSession:
      type: object
      required: [actor_id, actor_type, display_name, method]
      properties:
        actor_id:
          type: string
          format: uuid
        actor_type:
          type: string
        display_name:
          type: string
        method:
          type: string
          enum: [session, cli_token, development_header, test_header]
    CreateCLIAuthCodeRequest:
      type: object
      additionalProperties: false
      required: [name, token_ttl_days]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        token_ttl_days:
          type: integer
          minimum: 1
          maximum: 365
    CLIAuthCode:
      type: object
      additionalProperties: false
      required: [code, name, expires_at, token_expires_at]
      properties:
        code:
          type: string
          writeOnly: true
          pattern: "^anby_code_[A-Za-z0-9_-]+$"
        name:
          type: string
        expires_at:
          type: string
          format: date-time
        token_expires_at:
          type: string
          format: date-time
    ExchangeCLIAuthCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^anby_code_[A-Za-z0-9_-]+$"
          maxLength: 256
    CLIToken:
      type: object
      additionalProperties: false
      required:
        [id, name, token_prefix, status, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
        status:
          type: string
          enum: [active, expired, revoked]
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    CLITokenList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CLIToken" }
    CLIAuthExchangeResult:
      type: object
      additionalProperties: false
      required: [token, actor_id, display_name, token_info]
      properties:
        token:
          type: string
          writeOnly: true
          pattern: "^anby_token_[A-Za-z0-9_-]+$"
        actor_id:
          type: string
          format: uuid
        display_name:
          type: string
        token_info:
          $ref: "#/components/schemas/CLIToken"
