        source_page_id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/PageRedirectTarget"
        created_by:
          type: string
          format: uuid
        updated_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpsertBlockRedirectRequest:
