        - target_page_id
        - target_block_id
        - target_page_title
        - target_current_slug
        - created_by
        - created_at
      properties:
        source_page_id: { type: string, format: uuid }
        source_block_id: { type: string, format: uuid }
        target_page_id: { type: string, format: uuid }
        target_block_id: { type: string, format: uuid }
        target_page_title: { type: string }
        target_current_slug: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    BlockRedirectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BlockRedirect" }
    PublishRevisionRequest:
      type: object
      required: [ast]
      allOf:
        - if:
            required: [working_document_id]
          then:
            required: [expected_sequence]
        - if:
            required: [expected_sequence]
          then:
            required: [working_document_id]
      properties:
        expected_revision_id:
          type: string
          format: uuid
          description: |
            发布基线（乐观锁）：必须等于页面当前 Revision。
            首发布不传（要求页面尚无 Revision）；不一致返回 409 stale_revision。
        working_document_id:
          type: string
          format: uuid
          description: |
            可选的 active WorkingDocument。提供时，发布 Revision 与工作副本换基
            在同一事务完成，并且必须同时提供 expected_sequence。
            文档基线过期时返回 409 stale_revision。
        expected_sequence:
          type: integer
          format: int64
          minimum: 0
          description: |
            发布者物化 ast 时已经恢复到的 WorkingDocument durable sequence。
            必须与 working_document_id 同时提供；服务端在同一事务锁定工作副本后
            比较 latest_sequence，不一致返回 409 conflict，禁止旧工作副本发布。
        ast:
          type: object
          additionalProperties: true
          description: |
            Typed Block AST v1 文档（权威 Schema：contracts/schemas/ast/v1/ast.schema.json）。
            必须是 JSON 对象，type='document' 且 schema_version=1。
        summary:
          type: string
          description: 修改摘要
          example: 初版
        is_minor:
          type: boolean
          description: 小修改标志
          default: false
    PageWithContent:
      type: object
      required: [page, content, via_alias]
      description: 阅读端点响应：落地页元信息 + 当前 Revision 内容（渲染直连 ContentSnapshot）
      properties:
        page:
          $ref: "#/components/schemas/Page"
        content:
          nullable: true
          description: 当前 Revision 内容；页面已创建但未发布过为 null
          $ref: "#/components/schemas/PageContent"
        via_alias:
          type: boolean
          description: 是否经由 page_alias（旧标题别名）解析命中
        alias_title:
          type: string
          description: via_alias=true 时回显客户端请求的标题原文
        redirect:
          type: object
          nullable: true
          description: >-
            请求命中重定向源时出现。resolved=true 时 page/content 是本地落地页；
            unresolved 或 interwiki 终点返回 resolved=false、content=null，并由 target
            给出可治理的目标。
          required: [from_page_id, from_title, target, resolved, hops]
          properties:
            from_page_id:
              type: string
              format: uuid
              description: 重定向源页面 ID
            from_title:
              type: string
              description: 重定向源页面显示标题
            target:
              $ref: "#/components/schemas/PageRedirectTarget"
            resolved:
              type: boolean
            hops:
              type: integer
              minimum: 1
    PageContent:
      type: object
      required:
        [revision, delivery_mode, section_count, ast_json, html, renderer_version]
      description: >-
        已发布页面的当前 Revision 内容。delivery_mode=sections 时全文 AST/HTML
        为 null，客户端按 PageSectionManifest 加载可重建分片。
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
        delivery_mode:
          type: string
          enum: [full, sections]
        section_count:
          type: integer
          minimum: 1
        ast_json:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            当前 Revision 的 canonical Typed Block AST
            （权威 Schema：contracts/schemas/ast/v1/ast.schema.json）。
        html:
          type: string
          nullable: true
          description: 由 ast_json 渲染的安全 HTML 片段（不含 html/head；安全规则见 backend/internal/render/README.md）
        renderer_version:
          type: string
          description: 渲染器版本（M3 RenderedPage 投影按此版本判断缓存重建）
          example: v1
    Backlink:
      type: object
      required: [source_page_id, source_title, source_block_id, source_node_id, display_text]
      description: 一条反向链接：指向目标页的已解析引用来源
      properties:
        source_page_id:
          type: string
          format: uuid
          description: 来源页面 ID
        source_title:
          type: string
          description: 来源页面显示标题
          example: Anby Demara
        source_block_id:
          type: string
          format: uuid
          description: 引用所在 Block ID
        source_node_id:
          type: string
          description: 引用节点在 Block content 内的稳定定位键
        display_text:
          type: string
          description: 引用的展示文本
    BacklinkListPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items, next_cursor]
          description: 反向链接列表（source_page_id, source_block_id, source_node_id 升序游标分页）
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Backlink"
            next_cursor:
              type: string
              nullable: true
              description: 下一页游标；null 表示没有更多
    OutlineItem:
      type: object
      required: [heading_block_id, parent_heading_block_id, level, title, slug, position_key]
      description: 文档目录条目（heading 层级树的一个节点）
      properties:
        heading_block_id:
          type: string
          format: uuid
          description: Heading Block ID（章节权威身份之一，设计 §9）
        parent_heading_block_id:
          type: string
          format: uuid
          nullable: true
          description: 父 Heading Block ID（按 level 栈推导）；顶层为 null
        level:
          type: integer
          minimum: 1
          maximum: 6
          description: Heading 层级
        title:
          type: string
          description: Heading 纯文本标题
        slug:
          type: string
          description: 章节锚点 slug（展示地址，非权威身份；重复标题加 -2/-3 后缀）
          example: story-2
        position_key:
          type: string
          description: 同级 1 起编号的序号路径
          example: "1.2.3"
    DocumentOutline:
      type: object
      required: [items]
      description: 页面文档目录（按文档顺序；页面未发布过为空数组）
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OutlineItem"
    PageReference:
      type: object
      required:
        - number
        - citation_id
        - occurrence_count
        - first_block_id
        - first_node_id
        - occurrences
        - source_version_id
        - source_id
        - source_type
        - source_title
        - author
        - publisher
        - published_at
        - source_metadata
        - version_hash
        - fetched_at
        - locator
        - quotation
        - external_url
      properties:
        number:
          type: integer
          minimum: 1
          description: 按当前 Revision 中首次出现顺序生成的引用编号
        citation_id: { type: string, format: uuid }
        occurrence_count: { type: integer, minimum: 1 }
        first_block_id:
          type: string
          format: uuid
          description: 第一处正文引用所在 Block，用于参考文献回链
        first_node_id:
          type: string
          description: 第一处正文引用节点的块内定位键
        occurrences:
          type: array
          minItems: 1
          description: 按正文顺序排列的全部引用位置，供参考文献逐处回链
          items: { $ref: "#/components/schemas/PageReferenceOccurrence" }
        source_version_id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        source_type: { type: string }
        source_title: { type: string }
        author: { type: string, nullable: true }
        publisher: { type: string, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        source_metadata:
          type: object
          additionalProperties: true
        version_hash: { type: string }
        fetched_at: { type: string, format: date-time }
        locator:
          type: object
          additionalProperties: true
        quotation: { type: string, nullable: true }
        external_url: { type: string, format: uri, nullable: true }
    PageReferenceOccurrence:
      type: object
      additionalProperties: false
      required: [block_id, node_id]
      properties:
        block_id: { type: string, format: uuid }
        node_id:
          type: string
          description: 引用节点的块内定位键
    PageReferenceList:
      type: object
      required: [ready, revision_id, items]
      properties:
        ready:
          type: boolean
          description: false 表示当前 Revision 的引用投影尚未完成
        revision_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items: { $ref: "#/components/schemas/PageReference" }
    RelatedReason:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [page_link, backlink, reciprocal_link, collection, same_entity, entity_relation]
        label:
          type: string
          description: Collection 或 Entity 关系的可读标签
    RelatedPage:
      type: object
      required: [page_id, display_title, score, reasons]
      properties:
        page_id: { type: string, format: uuid }
        display_title: { type: string }
        score: { type: integer, minimum: 1 }
        reasons:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RelatedReason" }
    RelatedPageList:
      type: object
      required: [ready, revision_id, items]
      properties:
        ready:
          type: boolean
          description: false 表示当前 Revision 的相关文章投影尚未完成
        revision_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items: { $ref: "#/components/schemas/RelatedPage" }
    PageSectionSummary:
      type: object
      required: [key, position, title, size_bytes]
      properties:
        key:
          type: string
          description: lead 或稳定顶层 Heading Block ID
        position:
          type: integer
          minimum: 0
        heading_block_id:
          type: string
          format: uuid
        level:
          type: integer
          minimum: 1
          maximum: 6
        title:
          type: string
        size_bytes:
          type: integer
          minimum: 0
    PageSectionManifest:
      type: object
      required: [ready, citation_order, items]
      properties:
        ready:
          type: boolean
        revision_id:
          type: string
          format: uuid
        renderer_version:
          type: string
        citation_order:
          type: array
          items: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/PageSectionSummary" }
    RenderedPageSection:
      allOf:
        - $ref: "#/components/schemas/PageSectionSummary"
        - type: object
          required: [revision_id, ast_json, html, renderer_version]
          properties:
            revision_id: { type: string, format: uuid }
            ast_json:
              type: object
              additionalProperties: true
            html:
              type: string
            renderer_version:
              type: string
    PageSectionLocator:
      type: object
      required: [section_key, block_id]
      properties:
        section_key: { type: string }
        block_id: { type: string, format: uuid }
    AnchorTarget:
      type: object
      required: [page_id, block_id, current_slug, via_alias, via_redirect]
      description: 当前可导航章节目标；Block ID 是权威身份，slug 只用于展示地址
      properties:
        page_id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
        current_slug:
          type: string
        via_alias:
          type: boolean
          description: 输入 slug 是否命中历史别名
        via_redirect:
          type: boolean
          description: 是否跟随过至少一个 BlockRedirect
    ReferenceUsage:
      type: object
      required: [page_id, page_title, revision_id, block_id, node_id, mention_text, claim_id]
      description: Entity/Claim/Citation 在页面 Current Revision 中的一处引用位置
      properties:
        page_id:
          type: string
          format: uuid
        page_title:
          type: string
        revision_id:
          type: string
          format: uuid
          description: 产生该使用投影的来源 Revision
        block_id:
          type: string
          format: uuid
        node_id:
          type: string
          description: 引用节点在 Block content 内的稳定定位键
        mention_text:
          type: string
          nullable: true
          description: EntityReference 的展示文本；Claim/Citation 使用位置为 null
        claim_id:
          type: string
          format: uuid
          nullable: true
          description: Citation 的可选 Claim 上下文；直接 CitationReference 为 null
    ReferenceUsageListPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
