        next_cursor:
          type: string
          nullable: true
          description: 下一页游标；null 表示没有更多
    RevisionListPage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items, next_cursor]
          description: Revision 历史列表（created_at DESC, id DESC 游标分页）
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Revision"
            next_cursor:
              type: string
              nullable: true
              description: 下一页游标；null 表示没有更多
    RevisionDetail:
      type: object
      required: [revision, ast_json]
      description: 单版详情：Revision 元信息 + canonical AST（不含 html）
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
        ast_json:
          type: object
          additionalProperties: true
          description: |
            该 Revision 的 canonical Typed Block AST
            （权威 Schema：contracts/schemas/ast/v1/ast.schema.json）。
    RollbackRequest:
      type: object
      required: [target_revision_id]
      properties:
        target_revision_id:
          type: string
          format: uuid
          description: 回滚目标 Revision ID（必须属于该页面，否则 404）
        summary:
          type: string
          description: 修改摘要；缺省记录「回滚到 {target_revision_id}」
          example: 撤销破坏性编辑
    RollbackResponse:
      allOf:
        - $ref: "#/components/schemas/Revision"
        - type: object
          required: [rolled_back_to]
          description: 回滚产生的新 Revision + 回滚目标
          properties:
            rolled_back_to:
              type: string
              format: uuid
              description: 回滚目标 Revision ID
    FieldChange:
      type: object
      required: [field, before, after]
      description: 单字段 before/after 摘要（值为 canonical JSON 文本，单侧不存在为 "(absent)"）
      properties:
        field:
          type: string
        before:
          type: string
        after:
          type: string
    BlockChange:
      type: object
      required: [type, block_id, parent_id]
      description: |
        一条 Block 级变更。同一 Block 字段与位置都变时产生 changed 与 moved 两条独立条目。
        parent_id 为变更后（added/changed/moved）或变更前（removed）的父 Block ID，顶层为空串。
      properties:
        type:
          type: string
          enum: [added, removed, changed, moved]
        block_id:
          type: string
        parent_id:
          type: string
        path:
          type: array
          items:
            type: integer
          description: 变更后（added）或变更前（removed）的索引路径
        before_path:
          type: array
          items:
            type: integer
          description: 仅 moved：变更前索引路径
        after_path:
          type: array
          items:
            type: integer
          description: 仅 moved：变更后索引路径
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"
          description: 仅 changed：字段级差异（按字段名排序）
    DocumentDiff:
      type: object
      required: [changes]
      description: |
        两版结构 Diff（按 Block ID 对齐 base=from 与 current=to）。
        changes 按 current 前序排列，removed 按 base 前序追加在后，确定性输出；
        from == to 时为空数组。
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/BlockChange"
  responses:
    BadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 已认证但无权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: 资源曾存在但已删除（如软删除页面、重定向目标已删除）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: 请求语义可理解但无法处理（如重定向环/重定向链过深）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 并发冲突（含陈旧基线、幂等键冲突）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: 触发限流，需退避后重试
      headers:
        Retry-After:
          description: 建议等待的秒数
          schema: { type: integer }
        X-RateLimit-Limit:
          description: 当前窗口配额
          schema: { type: integer }
        X-RateLimit-Remaining:
          description: 当前窗口剩余配额
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: 服务端内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
