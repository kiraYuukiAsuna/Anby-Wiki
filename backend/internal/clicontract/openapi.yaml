openapi: 3.1.0
info:
  title: Anby Wiki API
  version: "0.1.0"
  description: |
    Anby Wiki HTTP API 权威契约（OpenAPI 3.1）。
    本文件是所有接口行为的唯一权威定义：错误模型、分页、幂等头与请求 ID 在此统一定义。
    前端客户端由 OpenAPI Generator 从本文件生成，禁止手写 URL/DTO。
    Go 侧 handler 手写实现，由 Contract Test 保证与本文件一致。
  contact:
    name: Anby Wiki
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://localhost:3000
    description: 本地 Web 入口（Next.js 将 /api/* 转发到 Go API）
  - url: http://localhost:8080
    description: 本地直连 Go API
tags:
  - name: meta
    description: 服务元信息与健康检查
  - name: auth
    description: 本地账号注册、密码登录与服务端会话
  - name: pages
    description: 页面创建、改名与 Revision 发布（写 API）
  - name: reading
    description: 页面阅读（按标题/别名/ID 读取当前 Revision 与渲染 HTML，匿名可读）
  - name: history
    description: Revision 历史、两版结构 Diff 与回滚（读匿名，回滚需登录）
  - name: projection
    description: 页面与知识/证据关系投影查询（反链、目录、Entity/Claim/Citation 使用位置；匿名可读，最终一致）
  - name: search
    description: 页面搜索（编辑器引用选择器，匿名可读）
  - name: knowledge
    description: Entity、Claim 与 Citation 稳定 ID 详情（匿名只读）
  - name: assets
    description: 媒体资产目录、不可变版本与内容读取
  - name: sources
    description: 来源目录、不可变来源版本、可定位分片与 Citation 证据
  - name: datasets
    description: 可查询结构化数据、记录 Schema 与保存视图
  - name: components
    description: 信息框组件注册、不可变版本、可信渲染器与预览
  - name: collections
    description: Manual/Rule/Dynamic Collection、成员维护与安全查询
  - name: governance
    description: Proposal、风险审核、预览、原子 Apply 与 ChangeBatch 回滚
  - name: imports
    description: AI 来源导入任务、阶段进度、取消与重试
  - name: admin
    description: 仅管理员可用的站点运行时配置
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: 注册本地账号并建立会话
      description: >-
        用户名和邮箱均不区分大小写且全站唯一。首个本地账号获得管理员角色，
        后续账号默认获得编辑者角色；注册默认关闭，部署方须通过
        AUTH_REGISTRATION_ENABLED 显式开启。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: 注册成功，设置 HttpOnly session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: 使用用户名或邮箱和密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功，设置 HttpOnly session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: 获取当前登录 Actor
      security:
        - sessionCookie: []
        - cliBearer: []
      responses:
        "200":
          description: 当前登录会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 吊销当前服务端 session 并清除 cookie
      security:
        - sessionCookie: []
      responses:
        "204":
          description: 已退出；无活动 session 时同样成功
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/cli/codes:
    post:
      operationId: createCLIAuthCode
      tags: [auth]
      summary: 创建一次性 CLI 授权码
      description: >-
        仅浏览器 Session 可调用。授权码十分钟内有效且只能兑换一次；响应中的明文码
        不会再次返回，服务端只持久化 SHA-256。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCLIAuthCodeRequest" }
      responses:
        "201":
          description: 一次性授权码
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CLIAuthCode" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/cli/exchange:
    post:
      operationId: exchangeCLIAuthCode
      tags: [auth]
      summary: 兑换一次性授权码
      description: CLI 用短时授权码换取只显示一次的 Bearer Token。
      x-anby-cli-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExchangeCLIAuthCodeRequest" }
      responses:
        "200":
          description: CLI Token；明文 token 只在本响应出现
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CLIAuthExchangeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/cli/tokens:
    get:
      operationId: listCLITokens
      tags: [auth]
      summary: 列出当前账号的 CLI Token
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 包含有效、过期和已撤销 Token 的审计目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CLITokenList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/cli/tokens/{id}:
    delete:
      operationId: revokeCLIToken
      tags: [auth]
      summary: 撤销当前账号的指定 CLI Token
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Token 已撤销；重复撤销保持成功
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/auth/cli/token:
    delete:
      operationId: revokeCurrentCLIToken
      tags: [auth]
      summary: 撤销当前 Bearer Token
      x-anby-cli-only: true
      security:
        - cliBearer: []
      responses:
        "204":
          description: 当前 Token 已撤销
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/import-jobs:
    get:
      operationId: listImportJobs
      tags: [imports]
      summary: 分页列出当前账号的导入任务
      description: 按创建时间倒序返回，刷新或重新登录后仍可恢复完整导入队列。
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, succeeded, failed, cancelled]
      responses:
        "200":
          description: 当前账号的导入任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobListPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createImportJob
      tags: [imports]
      summary: 幂等创建来源导入任务
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateImportJobRequest" }
      responses:
        "201":
          description: 已排队的导入任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: 列出当前站点的媒体资产
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: kind
          in: query
          schema:
            type: string
            enum: [image, video, other]
      responses:
        "200":
          description: 资产目录游标分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetListPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Internal" }
    post:
      operationId: uploadAsset
      tags: [assets]
      summary: 上传媒体资产并创建不可变版本
      security:
        - sessionCookie: []
        - cliBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
      responses:
        "200":
          description: 内容去重命中，返回既有资产版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "201":
          description: 新资产或新版本
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/Internal" }
  /api/v1/assets/revisions/{revision_id}:
    get:
      operationId: getAssetRevision
      tags: [assets]
      summary: 读取不可变资产版本元数据
      parameters:
        - $ref: "#/components/parameters/AssetRevisionId"
      responses:
        "200":
          description: 资产版本元数据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetRevision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/assets/revisions/{revision_id}/content:
    get:
      operationId: getAssetRevisionContent
      tags: [assets]
      summary: 流式读取不可变资产版本内容
      parameters:
        - $ref: "#/components/parameters/AssetRevisionId"
      responses:
        "200":
          description: 带 immutable 缓存头的原始资产内容
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: ETag 未变化
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Internal" }
  /api/v1/sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: 分页浏览逻辑来源目录
      description: 只查询来源元数据，不读取 SourceChunk 正文。
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: source_type
          in: query
          schema:
            type: string
            enum: [webpage, pdf, book, image, video, api, database]
        - name: q
          in: query
          description: 标题、作者或发布者的元数据搜索，最长 200 字符。
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: 来源目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSourceListPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createSource
      tags: [sources]
      summary: 登记逻辑来源
      description: URL 会经领域服务规范化并幂等关联 ExternalResource。
      security:
        - sessionCookie: []
        - cliBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEvidenceSourceRequest" }
      responses:
        "201":
          description: 已创建来源
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/sources/{id}:
    get:
      operationId: getSource
      tags: [sources]
      summary: 读取来源与规范化外部资源
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 来源详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSourceDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/sources/{id}/versions:
    get:
      operationId: listSourceVersions
      tags: [sources]
      summary: 分页列出来源的不可变版本
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 来源版本目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSourceVersionListPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/source-versions/{id}/chunks:
    get:
      operationId: listSourceChunks
      tags: [sources]
      summary: 分页列出不可变来源版本的可定位分片
      description: SourceChunk 正文可能包含来源全文片段，不写入日志。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 来源分片目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceSourceChunkListPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/citations:
    post:
      operationId: createCitation
      tags: [sources]
      summary: 创建不可变 Citation
      description: 引文若绑定 SourceChunk，必须是该分片文本的真实子串。
      security:
        - sessionCookie: []
        - cliBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCitationRequest" }
      responses:
        "201":
          description: 已创建 Citation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CitationRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/datasets:
    get:
      operationId: listDatasets
      tags: [datasets]
      summary: 列出站点 Dataset
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Dataset 游标分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetListPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createDataset
      tags: [datasets]
      summary: 创建带 JSON Schema 的 Dataset
      security:
        - sessionCookie: []
        - cliBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDatasetRequest" }
      responses:
        "201":
          description: Dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/datasets/{id}:
    get:
      operationId: getDataset
      tags: [datasets]
      summary: 读取 Dataset 定义
      parameters:
        - $ref: "#/components/parameters/GovernanceId"
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/datasets/{id}/records:
    get:
      operationId: listDatasetRecords
      tags: [datasets]
      summary: 按稳定默认顺序列出 DatasetRecord
      parameters:
        - $ref: "#/components/parameters/GovernanceId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: DatasetRecord 分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetRecordPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDatasetRecord
      tags: [datasets]
      summary: 创建经 Dataset Schema 校验的记录
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/GovernanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteDatasetRecordRequest" }
      responses:
        "201":
          description: DatasetRecord
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/datasets/{id}/views:
    get:
      operationId: listDatasetViews
      tags: [datasets]
      summary: 列出 Dataset 的保存视图
      parameters:
        - $ref: "#/components/parameters/GovernanceId"
      responses:
        "200":
          description: DatasetView 列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetViewList" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDatasetView
      tags: [datasets]
      summary: 创建筛选、排序与分组视图
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/GovernanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDatasetViewRequest" }
      responses:
        "201":
          description: DatasetView
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/dataset-records/{id}:
    put:
      operationId: updateDatasetRecord
      tags: [datasets]
      summary: 更新记录并重新执行 Dataset Schema 校验
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/GovernanceId"
      requestBody:
        required: true
        content:
          application/json:
