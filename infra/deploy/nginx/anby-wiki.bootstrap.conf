# Render using scripts/install-nginx.sh bootstrap.
server {
    listen 80;
    listen [::]:80;
    server_name __ANBY_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "Anby Wiki is starting; HTTPS will be enabled after deployment.\n";
    }
}
