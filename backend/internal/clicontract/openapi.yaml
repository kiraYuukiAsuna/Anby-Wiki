  /api/v1/search/capabilities:
    get:
      operationId: getSearchCapabilities
      summary: 获取搜索引擎能力
      description: |
        匿名可读。返回当前 SearchAdapter 的真实后端、可用排序模式和聚合维度；
        未配置向量 Embedder 时不会宣称支持 hybrid / semantic。
      tags: [search]
      responses:
        "200":
          description: 当前搜索能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchCapabilities"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/search:
    get:
      operationId: searchPages
      summary: 搜索活页面
      description: |
        独立搜索引擎 SearchAdapter 的匿名查询端点（无需登录）。
        搜索文档由 Outbox 驱动的 Current Revision 投影生成，覆盖标题、旧别名、
        正文和主 Entity 文本；支持关键词、混合、纯语义搜索，以及字段、
        命名空间、语言与 Entity 类型过滤和聚合。
        PostgreSQL 仅作为可重建权威 staging 与开发回退；回退环境只支持 keyword。
        高亮使用 [[ 与 ]] 标记，调用方必须按纯文本处理，不能作为 HTML 注入。
        q 为空（trim 后）返回空列表；limit 缺省 10、最大 50。
      tags: [search]
      parameters:
        - name: q
          in: query
          required: false
          description: 查询词（空白裁剪后为空则返回空列表）
          schema:
            type: string
            example: anby
        - name: namespace
          in: query
          required: false
          description: 命名空间 key；缺省不过滤
          schema:
            type: string
            example: main
        - name: language
          in: query
          required: false
          description: 页面语言精确过滤；缺省不过滤
          schema:
            type: string
            example: zh-Hans
        - name: entity_type
          in: query
          required: false
          description: 页面主 Entity 类型 key 精确过滤；缺省不过滤
          schema:
            type: string
            example: character
        - name: fields
          in: query
          required: false
          description: 搜索字段；缺省搜索全部字段，可重复传递
          schema:
            type: array
            items:
              type: string
              enum: [title, alias, body, entity]
          style: form
          explode: true
        - name: mode
          in: query
          required: false
          description: 排序模式；hybrid / semantic 仅在能力端点声明可用时使用
          schema:
            type: string
            enum: [keyword, hybrid, semantic]
            default: keyword
        - name: semantic_ratio
          in: query
          required: false
          description: hybrid 模式下语义结果权重；缺省 0.5
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 1
            default: 0.5
        - name: limit
          in: query
          required: false
          description: 返回条数上限（缺省 10，最大 50，超出截断）
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: offset
          in: query
          required: false
          description: 分页偏移量（缺省 0）
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: 搜索结果与命中总数
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/by-title:
    get:
      operationId: getPageByTitle
      summary: 按标题/别名读取页面当前版本
      description: |
        阅读端点（匿名可读，无需登录）。渲染直连 ContentSnapshot，
        M3 才引入 RenderedPage 投影与缓存。
        标题经服务端规范化（NFC、大小写折叠、空白折叠）后先匹配活页面，再匹配 page_alias：
        - 活页面命中：200 PageWithContent，via_alias=false；
        - 别名命中：200 PageWithContent，via_alias=true 且 alias_title 回显请求标题；
        - 不存在：404 not_found。
        页面是站内重定向源（page_redirect 有行）时跟随到落地页并返回其内容，
        响应带 redirect: {from_page_id, from_title}；重定向环/超过最大跳数返回 422；
        重定向目标已软删除返回 410 gone（资源曾存在、现已删除，语义区别于 404）。
        页面已创建但未发布过时 200 且 content 为 null。
      tags: [reading]
      parameters:
        - name: namespace
          in: query
          required: true
          description: 命名空间 key（如 main）
          schema:
            type: string
            example: main
        - name: title
          in: query
          required: true
          description: 页面标题（服务端规范化后匹配活页面或别名）
          schema:
            type: string
            example: Anby Demara
        - $ref: "#/components/parameters/ContentMode"
      responses:
        "200":
          description: 页面元信息 + 当前 Revision 元信息 + AST + 渲染 HTML
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageWithContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}:
    get:
      operationId: getPageByID
      summary: 按 ID 读取页面当前版本
      description: |
        阅读端点（匿名可读，无需登录）。按页面 ID 读取当前 Revision 与渲染 HTML，
        响应结构与行为同 getPageByTitle（重定向同样跟随；软删除页返回 410 gone；
        未发布过 content 为 null）。
      tags: [reading]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/ContentMode"
      responses:
        "200":
          description: 页面元信息 + 当前 Revision 元信息 + AST + 渲染 HTML
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageWithContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages:
    get:
      operationId: listPublishedPages
      summary: 浏览已发布百科页面目录
      description: |
        匿名可读。只返回未删除、属于内容命名空间且已有 Current Revision 的页面；
        recent 按最近更新倒序，title 按规范化标题升序，均使用稳定游标分页。
      tags: [reading]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [recent, title]
            default: recent
      responses:
        "200":
          description: 已发布页面目录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageCatalogPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createPage
      summary: 创建页面
      description: |
        在默认站点（wiki 固定为种子里 site_key='default' 的站点）创建页面。
        标题经服务端规范化（NFC、大小写折叠、空白折叠），与同 wiki+namespace 的
        活页面或别名冲突时返回 409。
        Actor 身份由服务端 session cookie 解析；客户端不能声明 Actor。
      tags: [pages]
      security:
        - sessionCookie: []
        - cliBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageRequest"
      responses:
        "201":
          description: 页面已创建
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/rename:
    post:
      operationId: renamePage
      summary: 页面改名
      description: |
        更新页面标题，旧标题写入 page_alias（Page ID 不变）。
        新标题被同 wiki+namespace 的活页面或其他页面的别名占用时返回 409。
      tags: [pages]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/PageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePageRequest"
      responses:
        "200":
          description: 改名后的页面
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/redirect:
    get:
      operationId: getPageRedirect
      summary: 读取页面当前重定向
      tags: [pages]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: 当前权威重定向
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageRedirect"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createPageRedirect
      summary: 创建或更新页面重定向
      description: >-
        支持同 Wiki Page、Page 稳定章节、尚未解析的命名空间/标题和外部 Wiki URL。
        服务端验证判别联合、章节身份与完整内部链路，拒绝自重定向、循环和已删除目标。
      tags: [pages]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/PageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageRedirectRequest"
      responses:
        "200":
          description: 已写入重定向
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageRedirect"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deletePageRedirect
      summary: 删除页面当前重定向
      tags: [pages]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "204":
          description: 重定向已删除
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/pages/{id}/block-redirects:
    get:
      operationId: listBlockRedirects
      summary: 列出页面的稳定章节迁移映射
      tags: [pages]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: BlockRedirect 列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockRedirectList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pages/{id}/block-redirects/{block_id}:
    put:
      operationId: upsertBlockRedirect
      summary: 创建或更新稳定章节迁移映射
      description: 目标会解析并折叠到当前有效 Heading Block；服务端拒绝环和悬空目标。
      tags: [pages]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: block_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertBlockRedirectRequest" }
      responses:
        "200":
          description: 当前 BlockRedirect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockRedirect" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      operationId: deleteBlockRedirect
      summary: 删除错误的章节迁移映射（审计历史保留）
      tags: [pages]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: block_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: 已删除 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/pages/{id}/revisions:
    get:
      operationId: listRevisions
      summary: Revision 历史列表
      description: |
        阅读端点（匿名可读，无需登录）。按 (created_at DESC, id DESC) 游标分页
        列出页面 Revision 元信息（含冗余自快照的 content_hash/schema_version，不含 AST）。
        首页不传 cursor；后续页传上一页响应的 next_cursor；next_cursor 为 null 表示没有更多。
        游标无法解析返回 400 validation_failed；页面不存在返回 404。
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 一页 Revision 历史
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: publishRevision
      summary: 发布 Revision
      description: |
        原子发布一个 Revision：校验 AST（Typed Block AST v1，schema_version=1）后，
        在单事务内写入 ContentSnapshot / Revision / 页面当前指针 / AuditEvent / OutboxEvent。
        乐观锁：expected_revision_id 必须等于页面当前 Revision（首发布不传，
        要求页面尚无 Revision）；不一致返回 409 stale_revision。
        content_hash 与 size_bytes 由服务端对 canonical AST 计算，客户端提供的值不被信任。
      tags: [pages]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/PageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRevisionRequest"
      responses:
        "201":
          description: 发布成功的 Revision
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 并发冲突（陈旧基线 stale_revision）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: stale_revision
                message: "page: 基线 Revision 已过期: page=… expected=… current=…"
                request_id: 9f1c2ab3d4e5f607
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/revisions/{rid}:
    get:
      operationId: getRevision
      summary: 单版详情
      description: |
        阅读端点（匿名可读，无需登录）。读取页面指定 Revision 的元信息与
        canonical AST（不含 html）。Revision 不存在或不属于该页面返回 404
        （跨页访问不泄露存在性）。
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Revision 元信息 + canonical AST
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/diff:
    get:
      operationId: diffRevisions
      summary: 两版结构 Diff
      description: |
        阅读端点（匿名可读，无需登录）。以 from 为 base、to 为 current，
        用后端 AST Diff（按 Block ID 对齐）计算结构差异：added/removed/changed/moved。
        from == to 返回空 changes。任一 Revision 不存在或不属于该页面返回 404。
      tags: [history]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - name: from
          in: query
          required: true
          description: 基线 Revision ID（Diff 的 base 侧）
          schema:
            type: string
            format: uuid
        - name: to
          in: query
          required: true
          description: 目标 Revision ID（Diff 的 current 侧）
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 结构 Diff（changes 确定性排序）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDiff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/rollback:
    post:
      operationId: rollbackPage
      summary: 回滚到历史版本
      description: |
        回滚不是修改旧 Revision（设计 §3.3）：以目标旧版快照内容复用发布事务
        追加一个新 Revision（parent = 当前 current），旧 Revision 与旧快照不动。
        内容 hash 与历史版本相同的快照按 (content_hash, schema_version) 复用，不重复存储。
        summary 缺省记录「回滚到 {target_revision_id}」，可由调用方覆盖。
        审计事件为 revision.rolled_back（payload 含 rolled_back_to）。
        目标 Revision 不属于该页面返回 404；并发语义与发布一致（行锁串行化）。
      tags: [history]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/PageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackRequest"
      responses:
        "201":
          description: 回滚产生的新 Revision（含 rolled_back_to）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/backlinks:
    get:
      operationId: listBacklinks
      summary: 页面反向链接
      description: |
        投影查询端点（匿名可读，无需登录）。列出指向该页面的已解析页面引用来源：
        来源页（id/标题）+ 所在 Block/Node + 展示文本。数据来自 page_link_projection 投影表
        （设计 §17.3：关系查询走投影表，不扫 AST），由 Worker 异步构建，
        新发布内容与投影之间存在最终一致窗口。
        按 (source_page_id, source_block_id, source_node_id) 升序游标分页：
        首页不传 cursor；后续页传上一页响应的 next_cursor；next_cursor 为 null 表示没有更多。
        游标无法解析返回 400 validation_failed；页面不存在返回 404；软删除页返回 410 gone。
      tags: [projection]
      parameters:
        - $ref: "#/components/parameters/PageId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 一页反向链接
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinkListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/outline:
    get:
      operationId: getPageOutline
      summary: 页面文档目录
      description: |
        投影查询端点（匿名可读，无需登录）。返回文档大纲（heading 层级树），
        含层级、纯文本标题、锚点 slug 与序号路径 position_key，供阅读页 TOC 与锚点跳转。
        数据来自 document_outline_projection / page_anchor 投影表（Worker 异步构建，最终一致）。
        页面不存在返回 404；软删除页返回 410 gone；页面未发布过返回 200 且 items 为空数组。
      tags: [projection]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: 文档目录（items 按文档顺序）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOutline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/pages/{id}/references:
    get:
      operationId: getPageReferences
      summary: 当前 Revision 的参考文献
      description: |
        匿名读取由 CitationUsage 投影生成的参考文献列表。编号按 Citation 在当前
        Revision 中首次出现的文档顺序生成，相同 Citation 的多次引用共享编号。
        ready=false 表示 Worker 尚未完成当前 Revision 的投影，客户端不得将其解释为空引用。
      tags: [projection]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: 当前 Revision 的参考文献列表
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageReferenceList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/pages/{id}/related:
    get:
      operationId: getRelatedPages
      summary: 当前页面的相关文章
      description: |
        匿名读取可重建的相关文章投影。排序综合正文链接、反向链接、双向链接、
        Collection、主 Entity 与 Entity 图谱关系，并返回可解释的匹配原因。
      tags: [projection]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: 相关文章（按相关度降序，最多 12 条）
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedPageList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "500": { $ref: "#/components/responses/Internal" }
  /api/v1/pages/{id}/sections:
    get:
      operationId: getPageSections
      summary: 读取当前 Revision 的章节分片清单
      description: >-
        匿名读取可重建的章节投影。仅当所有行匹配 Page.current_revision_id 与当前
        renderer_version 时 ready=true；否则返回 ready=false，客户端应使用全文阅读。
      tags: [projection]
      parameters:
        - $ref: "#/components/parameters/PageId"
      responses:
        "200":
          description: 当前章节分片清单
          content:
