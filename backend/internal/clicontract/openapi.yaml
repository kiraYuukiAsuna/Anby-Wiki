          required:
            - items
            - next_cursor
            - total_usage_count
            - total_page_count
            - total_block_count
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ReferenceUsage"
            next_cursor:
              type: string
              nullable: true
              description: 下一页游标；null 表示没有更多
            total_usage_count:
              type: integer
              format: int64
              description: 当前 Revision 中的引用位置总数（不受分页影响）
            total_page_count:
              type: integer
              format: int64
              description: 当前 Revision 中引用该目标的页面总数（不受分页影响）
            total_block_count:
              type: integer
              format: int64
              description: 当前 Revision 中包含引用的页面区块总数（不受分页影响）
    SourceUsage:
      type: object
      required:
        - page_id
        - page_title
        - revision_id
        - usage_count
        - block_count
        - citation_count
      properties:
        page_id: { type: string, format: uuid }
        page_title: { type: string }
        revision_id:
          type: string
          format: uuid
          description: 产生该投影的当前 Revision
        usage_count:
          type: integer
          format: int64
          minimum: 1
          description: 当前 Revision 中引用此 Source 的位置数
        block_count:
          type: integer
          format: int64
          minimum: 1
          description: 包含引用的不同 Block 数
        citation_count:
          type: integer
          format: int64
          minimum: 1
          description: 使用的不同 Citation 数
    SourceUsageLocation:
      type: object
      required: [block_id, node_id, citation_id]
      properties:
        block_id: { type: string, format: uuid }
        node_id: { type: string }
        citation_id: { type: string, format: uuid }
        claim_id:
          type: string
          format: uuid
          nullable: true
          description: 通过 Claim 展示证据时的上下文；正文直接引用时为空
    SourceUsageListPage:
      type: object
      required: [items, next_cursor, total_usage_count, total_page_count, total_block_count, total_citation_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SourceUsage" }
        next_cursor:
          type: string
          nullable: true
        total_usage_count: { type: integer, format: int64, minimum: 0 }
        total_page_count: { type: integer, format: int64, minimum: 0 }
        total_block_count: { type: integer, format: int64, minimum: 0 }
        total_citation_count: { type: integer, format: int64, minimum: 0 }
    SourceUsageLocationListPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
