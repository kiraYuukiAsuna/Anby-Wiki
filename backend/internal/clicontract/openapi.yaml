          type: string
          readOnly: true
        namespace_id:
          type: string
          format: uuid
          readOnly: true
        namespace:
          type: string
          minLength: 1
          maxLength: 64
        target_title:
          type: string
          minLength: 1
          maxLength: 255
        anchor_block_id:
          type: string
          format: uuid
        external_url:
          type: string
          format: uri
          maxLength: 2048
    PageRedirect:
      type: object
