# Render using scripts/install-nginx.sh production.
map $http_upgrade $anby_wiki_connection_upgrade {
    default upgrade;
    '' close;
}

upstream anby_wiki_web {
    server 127.0.0.1:__WEB_PORT__;
}

server {
    listen 80;
    listen [::]:80;
    server_name __ANBY_DOMAIN__;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://__ANBY_DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __ANBY_DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__ANBY_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ANBY_DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:anby_wiki_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/anby-wiki.access.log;
    error_log /var/log/nginx/anby-wiki.error.log;
    client_max_body_size 11m;

    location / {
        proxy_pass http://anby_wiki_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anby_wiki_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
