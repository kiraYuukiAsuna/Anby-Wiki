          type: integer
          minimum: 0
    Revision:
      type: object
      required:
        - id
        - page_id
        - parent_revision_id
        - content_snapshot_id
        - actor_id
        - summary
        - is_minor
        - visibility
        - content_hash
        - schema_version
        - storage_tier
        - created_at
      properties:
        id:
          type: string
          format: uuid
        page_id:
          type: string
          format: uuid
        parent_revision_id:
          type: string
          format: uuid
          nullable: true
          description: 父 Revision（单父版本链）；首发布为 null
        content_snapshot_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        summary:
          type: string
          description: 修改摘要
        is_minor:
          type: boolean
        visibility:
          type: string
          example: public
        content_hash:
          type: string
          description: SHA-256(CanonicalJSON(AST)) 小写 hex，服务端计算
          example: 3a6eb0790f39ac87c94f3856b2dd2c5d110e6811602261a9a923d3bb50adc8b7
        schema_version:
          type: integer
          description: AST Schema 版本（当前恒为 1）
          example: 1
        storage_tier:
          type: string
          enum: [hot, cold]
          description: 快照当前物理存储层；不影响 Revision 的逻辑不可变性
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: 迁移到 cold tier 的时间；hot 时为 null
        created_at:
          type: string
          format: date-time
