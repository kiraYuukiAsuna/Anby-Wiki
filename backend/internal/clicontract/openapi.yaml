    get:
      operationId: getEntityGraph
      summary: 查询 Entity 关系图
      description: |
        匿名读取由当前已发布 entity-valued Claim 派生的关系边投影。
        查询不扫描 Claim 或页面 AST；遍历深度最多 3、节点最多 100、边最多 250，
        并在达到硬上限时返回 truncated=true。
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ReferenceTargetId"
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [outbound, inbound, both]
            default: both
        - name: property_key
          in: query
          required: false
          schema:
            type: string
          description: 只沿指定 Property 的边遍历
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3
            default: 1
        - name: max_nodes
          in: query
          required: false
          schema:
            type: integer
            minimum: 2
            maximum: 100
            default: 60
      responses:
        "200":
          description: 有界 Entity 子图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityGraph"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
