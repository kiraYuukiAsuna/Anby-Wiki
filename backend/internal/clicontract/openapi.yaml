        retention_seconds:
          type: integer
          format: int64
          minimum: 1
        default_batch_size:
          type: integer
          minimum: 1
          maximum: 500
        hot_snapshots:
          type: integer
          format: int64
          minimum: 0
        cold_snapshots:
          type: integer
          format: int64
          minimum: 0
        hot_bytes:
          type: integer
          format: int64
          minimum: 0
        cold_bytes:
          type: integer
          format: int64
          minimum: 0
        eligible_snapshots:
          type: integer
          format: int64
          minimum: 0
        oldest_hot_created_at:
          type: string
          format: date-time
          nullable: true
    ArchiveRevisionSnapshotsRequest:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: 省略时使用服务端默认批次大小
    SnapshotArchiveResult:
      type: object
      additionalProperties: false
      required: [examined, archived, skipped, archived_bytes]
      properties:
        examined: { type: integer, minimum: 0 }
        archived: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        archived_bytes: { type: integer, format: int64, minimum: 0 }
    Proposal:
      type: object
      required: [id, target_type, status, risk_level, risk_reasons, policy_decision, created_by, idempotency_key, created_at, updated_at, operations, conflicts]
      properties:
        id: { type: string, format: uuid }
        import_job_id: { type: string, format: uuid, nullable: true }
        target_type: { type: string, enum: [wiki, page, entity, claim, collection, external_resource] }
        target_id: { type: string, format: uuid, nullable: true }
        base_revision_id: { type: string, format: uuid, nullable: true }
        base_state_version: { type: integer, nullable: true }
        status: { type: string, enum: [draft, submitted, in_review, approved, rejected, conflicted, applying, applied, failed, rolled_back] }
        risk_level: { type: string, enum: [low, medium, high, critical] }
        risk_reasons: { type: array, items: { type: string } }
        policy_decision: { type: object, additionalProperties: true }
        created_by: { type: string, format: uuid }
        idempotency_key: { type: string }
        change_batch_id: { type: string, format: uuid, nullable: true }
        change_batch_status:
          type: string
          enum: [applying, applied, failed, rollback_pending, rolled_back]
          nullable: true
        created_at: { type: string, format: date-time }
