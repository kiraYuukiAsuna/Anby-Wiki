# 生产部署参考清单。
#
# 与开发环境的区别：这里用 Docker 把数据层和应用一起拉起，
# 包括 PostgreSQL / Redis / MinIO / api / worker / web。
# 不再包含反向代理：web 是唯一对外发布端口的服务，
# 并通过 Next.js rewrites 把 /api/* 转发到内网的 api。
#
# 因此本清单不终结 TLS。若需要 HTTPS，请在其外层（云负载均衡、
# Cloudflare、宿主机上的独立代理等）终结，并同步调整
# TRUSTED_ORIGINS 与 SESSION_COOKIE_SECURE。
#
# 用法见 Deploy.md。所有相对路径相对本文件所在目录解析。

name: anby-wiki-production

x-runtime-security: &runtime-security
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    - app

x-app-environment: &app-environment
  ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY: "${S3_ACCESS_KEY:?set S3_ACCESS_KEY}"
  S3_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY}"
  SEARCH_BACKEND: postgres
  # 早期阶段占位登录：以共享令牌换会话，不验证真实身份。
  AUTH_DEV_LOGIN_ENABLED: ${AUTH_DEV_LOGIN_ENABLED:-true}
  AUTH_DEV_LOGIN_TOKEN: "${AUTH_DEV_LOGIN_TOKEN:?set AUTH_DEV_LOGIN_TOKEN}"
  AUTH_DEV_HEADER_ENABLED: "false"
  # 无 TLS 终结时必须为 false，否则浏览器不会回传 cookie。
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?set TRUSTED_ORIGINS}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-1200}
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
  RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-3}
  # 默认不信任 X-Forwarded-For：按直连的 web 容器计数。
  # 只有该对端已可靠清洗来源头时，才把它的固定 IP 列入这里。
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
  WORKER_METRICS_ADDR: ":9091"
  OBSERVABILITY_DB_INTERVAL: ${OBSERVABILITY_DB_INTERVAL:-30s}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}
  OTEL_TRACE_SAMPLE_RATE: ${OTEL_TRACE_SAMPLE_RATE:-0.1}

services:
  # ---- 数据层 ----

  storage-init:
    # 一次性 job：只修正新建命名卷的根目录属主，使数据服务可始终以非 root 运行。
    image: ${ALPINE_IMAGE:-alpine:3.22}
    profiles: ["tools"]
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - pgdata:/pgdata
      - miniodata:/miniodata
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown 70:70 /pgdata
        chown 1000:1000 /miniodata
    restart: "no"

  postgres:
    <<: *runtime-security
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wiki}
      POSTGRES_USER: ${POSTGRES_USER:-wiki}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      # 数据目录放在卷的子目录，避免与卷根的 lost+found 冲突。
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,mode=0755,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-wiki} -d $${POSTGRES_DB:-wiki}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    <<: *runtime-security
    image: ${REDIS_IMAGE:-redis:7-alpine}
    user: "999:1000"
    # 只做缓存与限流计数：关闭持久化，重启丢失可接受（ADR-0003）。
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio:
    <<: *runtime-security
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    user: "1000:1000"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?set S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?set S3_SECRET_KEY}"
    volumes:
      - miniodata:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    # 一次性 job：创建 bucket 并关闭匿名访问，完成后退出。
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z}
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      MINIO_ACCESS_KEY: "${S3_ACCESS_KEY:?set S3_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${S3_SECRET_KEY:?set S3_SECRET_KEY}"
      MC_CONFIG_DIR: /tmp/.mc
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set target http://minio:9000 \
          "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "target/$${MINIO_BUCKET}"
        mc anonymous set none "target/$${MINIO_BUCKET}"
        echo "minio-init: bucket '$${MINIO_BUCKET}' ready (anonymous access disabled)"
    networks:
      - app
    restart: "no"

  # ---- 应用层 ----

  api:
    <<: *runtime-security
    image: anby-wiki-api:${RELEASE_ID:?set RELEASE_ID}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
      args:
        VERSION: ${RELEASE_ID}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    user: "10001:10001"
    environment:
      <<: *app-environment
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  worker:
    <<: *runtime-security
    image: anby-wiki-worker:${RELEASE_ID:?set RELEASE_ID}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
      args:
        VERSION: ${RELEASE_ID}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    user: "10001:10001"
    environment:
      <<: *app-environment
      AI_IMPORT_ENABLED: ${AI_IMPORT_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/metrics"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  web:
    <<: *runtime-security
    image: anby-wiki-web:${RELEASE_ID:?set RELEASE_ID}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        VERSION: ${RELEASE_ID}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    user: "1000:1000"
    environment:
      API_BASE_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    # 唯一对外发布的端口。默认只绑本机，由外层代理决定是否公开。
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/web/.next/cache:size=128m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const n=require('net').connect(3000,'127.0.0.1',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  # ---- 运维工具（一次性任务） ----

  migrate:
    <<: *runtime-security
    profiles: ["tools"]
    image: anby-wiki-migrate:${RELEASE_ID:?set RELEASE_ID}
    pull_policy: never
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrate
      args:
        VERSION: ${RELEASE_ID}
        VCS_REF: ${VCS_REF:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    user: "10001:10001"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["wiki-migrate"]

  doctor:
    <<: *runtime-security
    profiles: ["tools"]
    image: anby-wiki-migrate:${RELEASE_ID:?set RELEASE_ID}
    pull_policy: never
    user: "10001:10001"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["wiki-doctor", "-format", "json"]

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  miniodata:
