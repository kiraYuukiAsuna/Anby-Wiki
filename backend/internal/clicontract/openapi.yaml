        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/entities/{id}/merge:
    get:
      operationId: getEntityMerge
      summary: 读取 Entity 的最近合并记录
      description: 匿名读取源 Entity 的最近一次合并及其不可变标签、Claim 映射账本。
      tags: [knowledge]
      parameters:
        - $ref: "#/components/parameters/ReferenceTargetId"
      responses:
        "200":
          description: Entity 合并记录
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMergeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: mergeEntity
      summary: 合并重复 Entity
      description: 仅站点管理员或 system Actor 可触发。合并、审计与 entity.merged Outbox 在同一事务提交；引用修复 Proposal 由 Worker 异步幂等生成。
      tags: [knowledge]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/ReferenceTargetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeEntityRequest"
      responses:
        "200":
          description: 合并完成；同一 source/target 的重复请求返回既有结果
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityMergeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/entity-merges/{id}/rollback:
    post:
      operationId: rollbackEntityMerge
      summary: 补偿回滚 Entity 合并
      description: |
        仅管理员可执行。服务端在一个事务中恢复源 Entity，补偿合并产生的 Claim，
        移除只由该合并复制且未被后续修改的标签，并追加审计；任何状态漂移都会拒绝整笔回滚。
      tags: [knowledge]
      security:
        - sessionCookie: []
        - cliBearer: []
      parameters:
        - $ref: "#/components/parameters/ReferenceTargetId"
      responses:
        "200":
          description: Entity 合并补偿结果；重复请求幂等返回
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RollbackEntityMergeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
