        - created_by
        - created_at
      properties:
        id: { type: string, format: uuid }
        page_id: { type: string, format: uuid, nullable: true }
        page_title: { type: string, nullable: true }
        namespace_id: { type: string, format: uuid, nullable: true }
        namespace_key: { type: string, nullable: true }
        normalized_title: { type: string, nullable: true }
        action_type:
          type: string
          enum: [create, edit, rename, review, apply, batch_rollback]
        required_role_id: { type: string, format: uuid }
        required_role_key: { type: string }
        required_role_name: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        revoked_by: { type: string, format: uuid, nullable: true }
    PageProtectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PageProtection" }
    CreatePageProtectionRequest:
      type: object
      required: [action_type, required_role_key]
      properties:
        page_id:
          type: string
          format: uuid
          nullable: true
          description: 已存在 Page 范围；与 namespace_key/normalized_title 二选一
        namespace_key:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
          description: create 标题范围；服务端在当前 Wiki 内解析为 Namespace ID
        normalized_title:
          type: string
          maxLength: 255
          description: create 标题范围；服务端统一规范化
        action_type:
          type: string
          enum: [create, edit, rename, review, apply, batch_rollback]
        required_role_key: { type: string, minLength: 1, maxLength: 64 }
        expires_at: { type: string, format: date-time, nullable: true }
    AITrustProfile:
      type: object
      required:
        - wiki_id
        - actor_id
        - actor_type
        - actor_display_name
        - trust_level
        - required_sample_percent
        - configured
      properties:
        wiki_id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        actor_type: { type: string, enum: [ai, import] }
        actor_display_name: { type: string }
        trust_level:
          type: string
          enum: [untrusted, assisted, trusted]
        required_sample_percent:
          type: integer
          minimum: 0
          maximum: 100
        configured: { type: boolean }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    AITrustProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AITrustProfile" }
    UpdateAITrustProfileRequest:
      type: object
      additionalProperties: false
      required: [trust_level, required_sample_percent]
      properties:
        trust_level:
          type: string
          enum: [untrusted, assisted, trusted]
        required_sample_percent:
          type: integer
          minimum: 0
          maximum: 100
    AIConfig:
      type: object
      additionalProperties: false
      required:
        - version
        - enabled
        - provider
        - base_url
        - model
        - response_format
        - max_input_tokens
        - chunk_characters
        - request_timeout_seconds
        - max_attempts
        - api_key_configured
      properties:
        version: { type: integer, const: 1 }
        enabled: { type: boolean }
        provider:
          type: string
          enum: [openai-compatible, deepseek]
        base_url: { type: string, format: uri }
        model: { type: string }
        response_format:
          type: string
          enum: [json_object, json_schema]
        max_input_tokens:
          type: integer
          minimum: 4096
          maximum: 2000000
          default: 128000
          description: 模型上下文允许的最大输入 Token；Worker 据此预留 Prompt/输出空间并分批抽取。
        chunk_characters:
          type: integer
          minimum: 1000
          maximum: 128000
          default: 32000
          description: 来源持久化分片的最大 Unicode 字符数；新解析的来源版本使用此值。
        request_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        max_attempts:
          type: integer
          minimum: 1
          maximum: 5
        api_key_configured: { type: boolean }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    UpdateAIConfigRequest:
      type: object
      additionalProperties: false
      required:
        - enabled
        - provider
        - base_url
        - model
        - response_format
        - max_input_tokens
        - chunk_characters
        - request_timeout_seconds
        - max_attempts
      properties:
        enabled: { type: boolean }
        provider:
          type: string
          enum: [openai-compatible, deepseek]
        base_url: { type: string, format: uri, minLength: 1 }
        model: { type: string, minLength: 1, maxLength: 256 }
        response_format:
          type: string
          enum: [json_object, json_schema]
        max_input_tokens:
          type: integer
          minimum: 4096
          maximum: 2000000
          default: 128000
        chunk_characters:
          type: integer
          minimum: 1000
          maximum: 128000
          default: 32000
        request_timeout_seconds:
          type: integer
          minimum: 5
          maximum: 300
        max_attempts:
          type: integer
          minimum: 1
          maximum: 5
        api_key:
          type: string
          writeOnly: true
          description: 首次保存必填；后续省略或空字符串表示保留已有密钥。
    AIConfigTestResult:
      type: object
      additionalProperties: false
      required: [ok, provider, model, latency_ms]
      properties:
        ok: { type: boolean, const: true }
        provider: { type: string }
        model: { type: string }
        latency_ms: { type: integer, format: int64, minimum: 0 }
    RevisionStorageStats:
      type: object
      additionalProperties: false
      required:
        - archive_available
        - retention_seconds
        - default_batch_size
        - hot_snapshots
        - cold_snapshots
        - hot_bytes
        - cold_bytes
        - eligible_snapshots
      properties:
        archive_available:
          type: boolean
