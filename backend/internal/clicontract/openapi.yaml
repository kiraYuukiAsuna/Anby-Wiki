  /api/v1/import-jobs/uploads:
    post:
      operationId: createImportUploadJob
      tags: [imports]
      summary: 校验并暂存用户文件，幂等创建来源导入任务
      security:
        - sessionCookie: []
        - cliBearer: []
      description: |
        接受最大 10 MiB 的 HTML、纯文本、JSON、CSV、PDF、PNG 或 JPEG。API 在排队前
        执行 MIME/magic、大小与恶意签名检查，并经 Evidence 领域服务写入私有对象存储；
        Worker 获取后会再次校验内容哈希与全部安全门禁。图片与无文本层 PDF 进入受限
        OCR；JSON API 快照与 CSV/JSON 数据库导出保留为可定位 SourceChunk。原始内容
        不写入 ImportJob config 或诊断日志。
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 255
                instructions:
                  type: string
                  maxLength: 4000
                route_mode:
                  type: string
                  enum: [auto, force_create]
                  default: auto
      responses:
        "201":
          description: 已暂存来源并排队的导入任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/Internal" }
  /api/v1/import-jobs/{id}:
